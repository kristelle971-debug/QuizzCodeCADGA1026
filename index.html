<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le grand jeu des codes</title>
<style>
:root{
  --green:#45967C; --blue:#247091; --violet:#484596;
  --green-l:#E6F2EE; --blue-l:#E3EEF4; --violet-l:#ECEBF6;
  --ink:#1f2933; --muted:#6b7280; --bg:#F5F7F9; --card:#ffffff;
  --ok:#2E9E6A; --ko:#D64545; --gold:#E8B730;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Calibri,system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:20px 16px 32px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:12px 16px;border-top:1px solid #e3e7eb}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(36,112,145,.10);padding:28px 24px;border-left:6px solid var(--blue)}
h1{margin:0 0 6px;font-size:30px;color:var(--green)}
.sub{color:var(--muted);margin:0 0 22px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:var(--green);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue)} .btn.violet{background:var(--violet)}
input[type=text]{width:100%;font-size:18px;padding:13px 14px;border-radius:12px;border:2px solid #d7dde3;margin:6px 0 18px;outline:none}
input[type=text]:focus{border-color:var(--blue)}
.rounds{display:grid;gap:10px;margin:0 0 24px}
.round{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bg)}
.round .num{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.round b{display:block}
.round span{color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:#fff}
.score{font-weight:800;font-size:18px;color:var(--blue)}
.streak{font-size:14px;color:var(--gold);font-weight:800;min-width:80px;text-align:right}
.bar{height:8px;background:#e3e7eb;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s}
.q-label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
.q{font-size:22px;font-weight:700;margin:0 0 20px;line-height:1.35}
.q .big{display:inline-block;font-size:34px;padding:6px 18px;border-radius:12px;background:var(--violet-l);color:var(--violet);font-family:Consolas,monospace}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.files{grid-template-columns:1fr}
.opt{border:2px solid #d7dde3;background:#fff;border-radius:14px;padding:16px 14px;font-size:17px;font-weight:600;cursor:pointer;text-align:center;color:var(--ink);transition:border-color .15s,background .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt:active:not(:disabled){transform:scale(.98)}
.opts.files .opt{font-family:Consolas,monospace;font-size:15px;text-align:left;word-break:break-all}
.opt.ok{border-color:var(--ok);background:#E5F6EE;color:#17643F}
.opt.ko{border-color:var(--ko);background:#FBE9E9;color:#8E2424}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;font-size:16px;display:none}
.feedback.ok{display:block;background:#E5F6EE;color:#17643F}
.feedback.ko{display:block;background:#FBE9E9;color:#8E2424}
.next{margin-top:18px;display:none;width:100%}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:10px;align-content:start}
.tile{border:2px solid #d7dde3;background:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;text-align:center;font-size:15px;transition:all .15s}
.tile.code{font-family:Consolas,monospace;color:var(--violet);font-size:17px}
.tile.sel{border-color:var(--blue);background:var(--blue-l);transform:scale(1.03)}
.tile.done{border-color:var(--ok);background:#E5F6EE;color:#17643F;cursor:default;opacity:.75}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.result{text-align:center}
.medal{font-size:72px;line-height:1;margin:6px 0 10px}
.final{font-size:44px;font-weight:900;color:var(--blue);margin:0}
.recap{text-align:left;margin:22px 0;background:var(--bg);border-radius:12px;padding:14px 16px}
.recap h3{margin:0 0 8px;font-size:16px;color:var(--violet)}
.recap li{margin:6px 0}
.recap code{background:var(--violet-l);color:var(--violet);padding:1px 6px;border-radius:6px;font-weight:700}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .q{font-size:19px} h1{font-size:25px} .card{padding:22px 16px}
}
</style>
</head>

      ['20261028_PLANNING_CocoL_CongesDecembre','Une demande de congés payés a son propre code : CP.']]},
 {s:'Le relevé bancaire d\'octobre de la Banque des Îles, daté du 31 octobre 2026.',
  ok:'20261031_RELEVE_BanqueDesIles_Octobre',
  ko:[['20261031_RIB_BanqueDesIles_Octobre','Le RIB donne les coordonnées bancaires ; le relevé, c\'est RELEVE.'],
      ['31-10-2026_RELEVE_BanqueDesIles_Octobre','Avec JJ-MM-AAAA, les fichiers ne se trient pas dans l\'ordre chronologique.'],
      ['20261031_RELEVE_BanqueDesÎles_Octobre','Pas d\'accents ni de lettres spéciales comme « Î ».']]},
 {s:'Le compte rendu de la réunion d\'équipe du 4 novembre 2026.',
  ok:'20261104_CR_Agence_ReunionEquipe',
  ko:[['20261104_ODJ_Agence_ReunionEquipe','L\'ODJ s\'envoie avant la réunion ; après, c\'est le compte rendu : CR.'],
      ['Compte_rendu_reunion_04-11-2026','La date se place en premier, au format AAAAMMJJ, et le code s\'écrit en majuscules.'],
      ['20261104_CR_Agence_Réunion Équipe','Pas d\'accents ni d\'espaces.']]},
 {s:'La note de frais de M. Rudy Alexis pour un déplacement au Moule le 6 novembre 2026.',
  ok:'20261106_NDF_AlexisR_DeplacementLeMoule',
  ko:[['20261106_NDF_RA_Deplacement','Les initiales seules sont ambiguës, et l\'objet est trop vague.'],
      ['20261106_JUSTIF_AlexisR_DeplacementLeMoule','Le justificatif, c\'est le ticket ; la demande de remboursement, c\'est la NDF.'],
      ['2026_11_06_NDF_AlexisR_DeplacementLeMoule','La date s\'écrit AAAAMMJJ, sans séparateur.']]},
 {s:'L\'avoir accordé au client Garage Moïse le 9 novembre 2026 pour une double facturation.',
  ok:'20261109_AVOIR_GarageMoise_DoubleFacturation',
  ko:[['20261109_FACT_GarageMoise_DoubleFacturation','Un avoir n\'est pas une facture : son code est AVOIR.'],
      ['20261109_AVOIR_GarageMoïse_DoubleFacturation','Pas de lettres accentuées comme « ï ».'],
      ['20261109_AVOIR_GarageMoise_DoubleFacturation_copie','Jamais de « copie » dans un nom de fichier.']]},
 {s:'Le contrat de travail de Mme Inès Ozier, assistante, signé le 2 novembre 2026.',
  ok:'20261102_CTRAV_OzierI_Assistante',
  ko:[['20261102_CERT_OzierI_Assistante','Le certificat de travail se remet au départ ; à l\'embauche, c\'est le contrat : CTRAV.'],
      ['20261102_CTRAV_Inès Ozier_Assistante','Pas d\'espaces ni d\'accents : nom puis initiale du prénom, OzierI.'],
      ['20261102_CTRAV_OzierI_Assistante#signé','Caractères spéciaux et accents interdits.']]}
];


// ---------- Outils ----------
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $app = document.getElementById('app');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function distractors(item, n) {
  const same = shuffle(CODES.filter(c => c[2] === item[2] && c[0] !== item[0]));
  const other = shuffle(CODES.filter(c => c[2] !== item[2]));
  return [...same.slice(0, 2), ...other].slice(0, n);
}
const ROUNDS = [
  {n:1, color:'var(--green)', title:'Quel est le code ?', desc:'On vous donne un document, trouvez son code.'},
  {n:2, color:'var(--blue)', title:'Que veut dire ce code ?', desc:'On vous donne un code, trouvez le document.'},
  {n:3, color:'var(--violet)', title:'De quoi s\'agit-il ?', desc:'On vous dit à quoi sert un document, trouvez lequel.'},
  {n:4, color:'var(--blue)', title:'Au bureau', desc:'Vos collègues parlent en codes : comprenez ce qu\'ils veulent dire.'},
  {n:5, color:'var(--violet)', title:'Le bon nom de fichier', desc:'Repérez le seul nom qui respecte la nomenclature.'},
  {n:6, color:'var(--green)', title:'Les paires', desc:'Associez chaque code à son document, le plus vite possible.'}
];

// ---------- État ----------
let S;
function newGame(name) {
  const pool = shuffle(CODES);
  const qs = [];
  pool.slice(0, 10).forEach(it => qs.push({round:1, item:it}));
  pool.slice(10, 20).forEach(it => qs.push({round:2, item:it}));
  pool.slice(20, 30).forEach(it => qs.push({round:3, item:it}));
  shuffle(DIALOGS).slice(0, 10).forEach(d => qs.push({round:4, dlg:d}));
  shuffle(FILES).slice(0, 6).forEach(f => qs.push({round:5, file:f}));
  qs.push({round:6, pairs: shuffle(pool.slice(30)).slice(0, 8)});
  S = {name, qs, i:0, score:0, streak:0, best:0, errors:[], max: (10 + 10 + 10 + 10 + 6) * 10 + 8 * 5};
}

// ---------- Écrans ----------
function home() {
  $app.innerHTML = `
  <div class="card">
    <h1>🎲 Le grand jeu des codes</h1>
    <p class="sub">Testez votre connaissance des documents de l'entreprise et de la nomenclature. Six manches, une seule règle : s'amuser !</p>
    <div class="rounds">${ROUNDS.map(r => `
      <div class="round"><div class="num" style="background:${r.color}">${r.n}</div><div><b>${r.title}</b><span>${r.desc}</span></div></div>`).join('')}
    </div>
    <label for="nm"><b>Votre prénom</b></label>
    <input id="nm" type="text" placeholder="Ex. : Laura" maxlength="30" autocomplete="off">
    <button class="btn" id="go" style="width:100%">C'est parti ! 🚀</button>
  </div>`;
  const nm = document.getElementById('nm');
  const start = () => { newGame(nm.value.trim() || 'Joueur'); intro(); };
  document.getElementById('go').onclick = start;
  nm.onkeydown = e => { if (e.key === 'Enter') start(); };
}

function intro() {
  const q = S.qs[S.i];
  const prev = S.i > 0 ? S.qs[S.i - 1].round : 0;
  if (q.round !== prev) {
    const r = ROUNDS[q.round - 1];
    $app.innerHTML = `
    <div class="card" style="text-align:center;border-left-color:${r.color}">
      <div class="q-label">Manche ${r.n} sur 6</div>
      <h1 style="color:${r.color}">${r.title}</h1>
      <p class="sub">${r.desc}</p>
      <button class="btn" style="background:${r.color}" id="ok">Je suis prête / prêt !</button>
    </div>`;
    document.getElementById('ok').onclick = render;
  } else render();
}

function header(q) {
  const r = ROUNDS[q.round - 1];
  const pct = Math.round(S.i / S.qs.length * 100);
  return `
  <div class="top">
    <span class="pill" style="background:${r.color}">Manche ${r.n} · ${r.title}</span>
    <span class="score">⭐ ${S.score} / ${S.max} pts</span>
    <span class="streak">${S.streak >= 2 ? '🔥 série de ' + S.streak : ''}</span>
  </div>
  <div class="bar"><i style="width:${pct}%"></i></div>`;
}

function render() {
  const q = S.qs[S.i];
  if (q.round === 6) return renderPairs(q);
  let label, question, opts, cls = '', good, explain;
  if (q.round === 1) {
    label = 'Quel est le code de ce document ?';
    question = `${esc(q.item[1])}`;
    opts = shuffle([q.item, ...distractors(q.item, 3)]).map(c => ({txt:c[0], ok:c[0] === q.item[0]}));
    good = q.item[0];
    explain = `<b>${q.item[0]}</b> = ${esc(q.item[1])} <span style="opacity:.75">(${FAM[q.item[2]]})</span>`;
  } else if (q.round === 2) {
    label = 'Que signifie ce code ?';
    question = `<span class="big">${q.item[0]}</span>`;
    opts = shuffle([q.item, ...distractors(q.item, 3)]).map(c => ({txt:c[1], ok:c[0] === q.item[0]}));
    good = q.item[1];
    explain = `<b>${q.item[0]}</b> = ${esc(q.item[1])} <span style="opacity:.75">(${FAM[q.item[2]]})</span>`;
  } else if (q.round === 3) {
    label = 'De quel document s\'agit-il ?';
    question = `« ${esc(q.item[3])} »`;
    opts = shuffle([q.item, ...distractors(q.item, 3)]).map(c => ({txt:c[1], ok:c[0] === q.item[0]}));
    good = q.item[1];
    explain = `<b>${esc(q.item[1])}</b> (code ${q.item[0]}) : ${esc(q.item[3]).toLowerCase()}`;
  } else if (q.round === 4) {
    label = '💬 ' + esc(q.dlg.who);
    question = `<span style="display:block;background:var(--blue-l);border-radius:14px;padding:14px 16px;font-style:italic;font-weight:600;margin-bottom:14px">« ${esc(q.dlg.s)} »</span>${esc(q.dlg.q)}`;
    opts = shuffle([{txt:q.dlg.ok, ok:true}, ...q.dlg.ko.map(k => ({txt:k, ok:false}))]);
    good = q.dlg.ok;
    explain = `<b>${q.dlg.k[0]}</b> = ${esc(q.dlg.k[1])}. ${esc(q.dlg.ex)}`;
  } else {
    label = 'Quel nom de fichier respecte la nomenclature ?';
    question = esc(q.file.s);
    cls = 'files';
    opts = shuffle([{txt:q.file.ok, ok:true}, ...q.file.ko.map(k => ({txt:k[0], ok:false, why:k[1]}))]);
    good = q.file.ok;
  }
  $app.innerHTML = `
  <div class="card" style="border-left-color:${ROUNDS[q.round - 1].color}">
    ${header(q)}
    <div class="q-label">${label}</div>
    <p class="q">${question}</p>
    <div class="opts ${cls}">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.txt)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <button class="btn blue next" id="nx">Suivant ➜</button>
  </div>`;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.k];
    btns.forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('ok'); });
    const fb = document.getElementById('fb');
    if (o.ok) {
      S.streak++; S.best = Math.max(S.best, S.streak);
      const bonus = 0;
      S.score += 10;
      fb.className = 'feedback ok';
      fb.innerHTML = `✅ ${pick(['Bravo !', 'Exact !', 'Parfait !', 'Bien joué !', 'Excellent !'])} ${bonus ? '<b>+2 bonus série 🔥</b>' : ''}` + (explain ? `<br>${explain}` : '');
    } else {
      S.streak = 0;
      b.classList.add('ko');
      fb.className = 'feedback ko';
      if (q.round === 5) {
        fb.innerHTML = `❌ ${esc(o.why)}<br>La bonne réponse : <b style="font-family:Consolas,monospace">${esc(good)}</b>`;
        S.errors.push(`Nom de fichier : <code>${esc(good)}</code>`);
      } else if (q.round === 4) {
        fb.innerHTML = `❌ Pas tout à fait…<br>${explain}`;
        S.errors.push(`<code>${q.dlg.k[0]}</code> = ${esc(q.dlg.k[1])}`);
      } else {
        fb.innerHTML = `❌ Pas tout à fait…<br>${explain}`;
        S.errors.push(`<code>${q.item[0]}</code> = ${esc(q.item[1])}`);
      }
    }
    const nx = document.getElementById('nx'); nx.style.display = 'block'; nx.focus();
    nx.onclick = () => { S.i++; S.i < S.qs.length ? intro() : end(); };
  });
}

function renderPairs(q) {
  const left = shuffle(q.pairs), right = shuffle(q.pairs);
  let sel = null, found = 0, misses = 0;
  $app.innerHTML = `
  <div class="card" style="border-left-color:var(--green)">
    ${header(q)}
    <div class="q-label">Touchez un code, puis le document qui va avec</div>
    <div class="match">
      <div class="col">${left.map(p => `<button class="tile code" data-c="${p[0]}">${p[0]}</button>`).join('')}</div>
      <div class="col">${right.map(p => `<button class="tile" data-d="${p[0]}">${esc(p[1])}</button>`).join('')}</div>
    </div>
    <div class="feedback" id="fb"></div>
    <button class="btn blue next" id="nx">Voir mon résultat 🏆</button>
  </div>`;
  const codes = [...document.querySelectorAll('[data-c]')], docs = [...document.querySelectorAll('[data-d]')];
  codes.forEach(t => t.onclick = () => {
    if (t.classList.contains('done')) return;
    codes.forEach(x => x.classList.remove('sel')); t.classList.add('sel'); sel = t;
  });
  docs.forEach(t => t.onclick = () => {
    if (!sel || t.classList.contains('done')) return;
    if (t.dataset.d === sel.dataset.c) {
      [t, sel].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
      found++; S.score += 5; sel = null;
      document.querySelector('.score').textContent = `⭐ ${S.score} / ${S.max} pts`;
      if (found === q.pairs.length) {
        const fb = document.getElementById('fb');
        fb.className = 'feedback ok';
        fb.innerHTML = misses === 0 ? '✅ Sans aucune erreur, chapeau ! 🎩' : `✅ Toutes les paires sont trouvées (${misses} erreur${misses > 1 ? 's' : ''} en route).`;
        const nx = document.getElementById('nx'); nx.style.display = 'block';
        nx.onclick = () => { S.i++; end(); };
      }
    } else {
      misses++;
      const p = q.pairs.find(x => x[0] === sel.dataset.c);
      if (!S.errors.some(e => e.includes(`<code>${p[0]}</code>`))) S.errors.push(`<code>${p[0]}</code> = ${esc(p[1])}`);
      [t, sel].forEach(x => { x.classList.add('shake'); setTimeout(() => x.classList.remove('shake'), 400); });
    }
  });
}

function end() {
  const pct = Math.round(S.score / S.max * 100);
  const [medal, msg] = pct >= 85 ? ['🏆', 'Championne / champion des codes !'] : pct >= 65 ? ['🥈', 'Très bon score, encore un petit effort !'] : pct >= 45 ? ['🥉', 'C\'est un bon début : relisez la fiche et retentez !'] : ['📚', 'Un petit tour par la fiche, et on rejoue !'];
  $app.innerHTML = `
  <div class="card result">
    <div class="q-label">Résultat de ${esc(S.name)}</div>
    <div class="medal">${medal}</div>
    <p class="final">${S.score} <span style="font-size:24px;color:var(--muted)">/ ${S.max} pts</span></p>
    <p class="sub" style="margin-top:6px">${msg}<br>Meilleure série : ${S.best} 🔥</p>
    ${S.errors.length ? `<div class="recap"><h3>📌 À revoir</h3><ul>${S.errors.map(e => `<li>${e}</li>`).join('')}</ul></div>` : '<p><b>Aucune erreur, bravo ! 🎉</b></p>'}
    <div class="actions">
      <button class="btn" id="again">Rejouer 🔁</button>
      <button class="btn violet" id="home">Changer de joueur</button>
    </div>
  </div>`;
  document.getElementById('again').onclick = () => { newGame(S.name); intro(); };
  document.getElementById('home').onclick = home;
  if (pct >= 65) confetti();
}
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- Confettis ----------
function confetti() {
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#45967C', '#247091', '#484596', '#E8B730'];
  const ps = Array.from({length: 140}, () => ({x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, r: 4 + Math.random() * 5,
    c: pick(cols), vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, a: Math.random() * 6}));
  let f = 0;
  (function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (++f < 260) requestAnimationFrame(loop); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}

home();
</script>
